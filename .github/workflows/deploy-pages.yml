# Build and deploy the Next.js static export to GitHub Pages.
# Vercel build is kept independent (vercel.json handles redirect).
name: Deploy Next.js site to Pages

# PR ではビルドと検査だけ (配布は main への push のみ)。
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 新しい lockfile / 依存に追従しやすいよう Node 24 (npm 11) を使う。
          # Node 20 だと "Missing: <pkg> from lock file" で npm ci が失敗する
          # ケースに遭遇するため (dts-viewer の ci.yml と同じ理由)。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # サブパス (basePath) 付きのビルドでも参照が壊れないことを先に確かめる。
      # 3d.ldas.jp はホスト直下なので本番では使わないが、basePath の付け忘れは
      # ホスト直下では隠れるため、フォーク先の github.io 配信などに備えて検査を残す。
      - name: Verify subpath build (basePath)
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build
          ./scripts/check-basepath.sh
          NEXT_PUBLIC_BASE_PATH=/iiif-3d-viewer npm run test:export
          rm -rf out .next

      # 本番 (3d.ldas.jp) はホスト直下で配る。独自ドメインは Pages の設定 (gh api) で指定済み。
      - name: Build static export
        env:
          # GA4 Measurement ID (公開値). Repo Variables に NEXT_PUBLIC_GA_ID を
          # 設定したデプロイ者だけが計測を有効化する。フォーク先で意図せず
          # オーナーの GA に送信しないため、fallback は持たない。未設定なら
          # ビルドは成功するが GoogleAnalytics は描画されない。
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: npm run build

      - name: Verify export (links, assets, robots/sitemap, no old hosts)
        run: npm run test:export

      - name: Add .nojekyll
        # Prevents GitHub Pages from running Jekyll, which would strip files
        # whose names start with underscore (e.g. Next.js's _next/ directory).
        run: touch out/.nojekyll

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
